apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-mcp
  namespace: ocr-service
  labels:
    app.kubernetes.io/name: ocr-mcp
    app.kubernetes.io/part-of: ocr-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ocr-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocr-mcp
        app.kubernetes.io/part-of: ocr-platform
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: mcp-server
          image: ryuk89/ocr-mcp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 18040
              name: http
          envFrom:
            - configMapRef:
                name: ocr-mcp-config
            - secretRef:
                name: ocr-mcp-secret
          volumeMounts:
            - name: mcp-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 18040
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 18040
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: mcp-data
          persistentVolumeClaim:
            claimName: ocr-mcp-data-pvc
