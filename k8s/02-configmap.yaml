apiVersion: v1
kind: ConfigMap
metadata:
  name: ocr-mcp-config
  namespace: ocr-service
  labels:
    app.kubernetes.io/name: ocr-mcp
    app.kubernetes.io/part-of: ocr-platform
data:
  OCR_CORE_URL: "http://ocr-core:8000"
  OCR_MCP_PUBLIC_URL: "https://ocr-core.regionhuanuco.gob.pe"
  OCR_MCP_PORT: "18040"
  OCR_MCP_HOST: "0.0.0.0"
  OCR_MCP_DATA_DIR: "/data"
  OCR_MCP_ADMIN_USER: "admin"
  OCR_MCP_TRUSTED_PROXIES: "*"
  FORWARDED_ALLOW_IPS: "*"
