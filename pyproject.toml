[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-mcp"
version = "0.1.0.dev0"
description = "Servidor MCP que pone el OCR de ocr-core al alcance de agentes de IA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # 3.0 cambiará valores por defecto de la validación de tokens.
  "mcp>=2.3,<3",
  "httpx>=0.28",
  "pypdf>=6.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
ocr-mcp = "ocr_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ocr_mcp = ["migrations/*.sql", "shared/templates/*.html", "modules/*/templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
